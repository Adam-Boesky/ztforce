
[project]
name = "ztforce"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Adam Boesky", email = "apboesky@gmail.com" }
]
description = "Forced PSF photometry on ZTF science images"
keywords = ["astronomy", "astrophysics", "ZTF", "photometry", "forced photometry", "lightcurve"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "astropy>=6.0",
    "requests>=2.28",
    "ztfquery>=1.28",
    "tqdm>=4.60",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
"Source Code" = "https://github.com/Adam-Boesky/ztforce"
"Documentation" = "https://ztforce.readthedocs.io"
"Issue Tracker" = "https://github.com/Adam-Boesky/ztforce/issues"
"Changelog" = "https://github.com/Adam-Boesky/ztforce/releases"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
dev = [
    "jupyter", # Clears output from Jupyter notebooks
    "mypy", # Used for static type checking of files
    "pre-commit", # Used to run checks before finalizing a git commit
    "pytest",
    "pytest-cov", # Used to report total code coverage
    "ruff", # Used for static linting of files
]

[build-system]
requires = [
    "setuptools>=77", # Used to build and package the Python project (>=77 for the PEP 639 license fields)
    "setuptools_scm>=6.2", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/ztforce/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src",
    "docs",
]
addopts = "--doctest-modules --doctest-glob=*.rst -m 'not network'"
markers = [
    "network: marks tests that require network access (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # docstrings
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
    # Numpy v2.0 compatibility
    "NPY201",
]
ignore = [
    "UP006", # Allow non standard library generics in type hints
    "UP007", # Allow Union in type hints
    "SIM114", # Allow if with same arms
    "B028", # Allow default warning level
    "SIM117", # Allow nested with
    "UP015", # Allow redundant open parameters
    "UP028", # Allow yield in for loop
]

[tool.mypy]
python_version = "3.10"
[tool.setuptools.package-data]
ztforce = ["py.typed"]

[tool.coverage.run]
omit=["src/ztforce/_version.py"]
